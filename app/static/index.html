<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1512">
<title>SwingCheck</title>
<style>
  :root { --bg:#0f1512; --card:#18211c; --line:#26332b; --text:#e8efe9; --dim:#93a399;
          --good:#4cc38a; --warn:#e8b33c; --bad:#ec5d5d; --accent:#7fd1a8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:4px 0 16px; letter-spacing:-.01em; }
  h1 a { color:inherit; text-decoration:none; }
  h2 { font-size:17px; margin:24px 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:14px; color:var(--dim); margin:10px 0 4px; }
  input[type=text], select { width:100%; padding:10px; border-radius:8px; border:1px solid var(--line); background:#0c110e; color:var(--text); font-size:16px; }
  .row { display:flex; gap:10px; align-items:center; }
  .check { display:flex; gap:8px; align-items:center; margin-top:12px; color:var(--text); font-size:15px; }
  button, .btn { appearance:none; border:0; border-radius:10px; padding:12px 16px; font-size:16px; font-weight:600;
                 background:var(--accent); color:#06120b; cursor:pointer; text-decoration:none; display:inline-block; }
  button.ghost { background:transparent; color:var(--dim); border:1px solid var(--line); font-weight:500; padding:8px 12px; font-size:14px; }
  button:disabled { opacity:.5; }
  .file { display:block; border:2px dashed var(--line); border-radius:12px; padding:22px; text-align:center; color:var(--dim); cursor:pointer; }
  .file input { display:none; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:10px; }
  .bar > div { height:100%; background:var(--accent); width:0; transition:width .3s; }
  .hist { display:flex; gap:12px; align-items:center; text-decoration:none; color:inherit; }
  .hist img, .hist .ph { width:56px; height:76px; object-fit:cover; border-radius:8px; background:var(--line); flex:none; }
  .hist .t { font-weight:600; }
  .muted { color:var(--dim); font-size:14px; }
  .pill { display:inline-block; font-size:12px; padding:2px 8px; border-radius:20px; background:var(--line); color:var(--dim); margin-right:4px; }
  .pill.ref { background:#2a3a5a; color:#b8cdf5; }
  .dots span { display:inline-block; min-width:22px; text-align:center; border-radius:6px; font-size:13px; font-weight:700; margin-right:3px; padding:1px 4px; color:#0b0f0c; }
  video { width:100%; max-height:70vh; border-radius:10px; background:#000; }
  .chk { border-left:4px solid var(--line); }
  .chk.good { border-left-color:var(--good); } .chk.warn { border-left-color:var(--warn); } .chk.bad { border-left-color:var(--bad); }
  .chk .head { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .chk .title { font-weight:600; }
  .status { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .status.good { color:var(--good); } .status.warn { color:var(--warn); } .status.bad { color:var(--bad); }
  .val { font-size:15px; margin:4px 0; }
  .tip { margin-top:8px; padding:8px 10px; background:#0c110e; border-radius:8px; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .grid figure { margin:0; } .grid img { width:100%; border-radius:8px; display:block; }
  .grid figcaption { font-size:13px; color:var(--dim); margin-top:3px; text-transform:capitalize; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; }
  .s-good { color:var(--good); } .s-warn { color:var(--warn); } .s-bad { color:var(--bad); }
  .priority { border:1px solid var(--warn); }
  .tips li { margin-bottom:6px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const VIEW = { face_on: "Face-on", dtl: "Down-the-line", auto: "Auto" };
const COLOR = { good: "var(--good)", warn: "var(--warn)", bad: "var(--bad)" };
const TRACK = { good: ["good", "Tracking good"], fair: ["warn", "Tracking fair"], poor: ["bad", "Tracking poor"] };
const trackPill = t => t && t.grade !== "good" ? `<span class="pill s-${TRACK[t.grade][0]}">${TRACK[t.grade][1]}</span>` : "";
let pollTimer = null;
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

function route() {
  clearTimeout(pollTimer);
  const m = location.hash.match(/^#\/s\/(\w+)(?:\?ref=(\w+))?/);
  m ? showSwing(m[1], m[2]) : showHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

function dots(c) {
  if (!c) return "";
  return `<span class="dots">${["good","warn","bad"].map(s => c[s] ? `<span style="background:${COLOR[s]}">${c[s]}</span>` : "").join("")}</span>`;
}

async function showHome() {
  const app = $("#app");
  app.innerHTML = `
  <h1>SwingCheck</h1>
  <div class="card">
    <label class="file" id="drop"><input type="file" id="f" accept="video/*,.zip,application/zip" multiple>
      <div id="fname">Tap to choose videos or a .zip of videos: single swings or whole range sessions (you can pick several)</div></label>
    <label>Camera angle</label>
    <select id="view">
      <option value="auto">Detect automatically</option>
      <option value="face_on">Face-on (camera facing your chest)</option>
      <option value="dtl">Down-the-line (camera behind you, toward target)</option>
    </select>
    <label>Label (optional)</label>
    <input type="text" id="label" placeholder="e.g. 7 iron, Saturday range">
    <label class="check"><input type="checkbox" id="isref"> This is a reference swing (a pro to compare against)</label>
    <div style="margin-top:14px"><button id="go" disabled>Analyze</button></div>
    <div class="bar" id="bar" hidden><div></div></div>
    <div class="muted" id="msg" style="margin-top:8px"></div>
  </div>
  <details class="card"><summary><b>Filming tips</b></summary>
    <ul class="tips muted">
      <li>Phone at hip height, about 10–12 ft away, whole body and club in frame for the entire swing.</li>
      <li>Face-on: camera points at your chest, in line with the ball. Down-the-line: camera behind your hands, pointing at the target.</li>
      <li>Keep the phone still (tripod or lean it on your bag). Only you in the shot.</li>
      <li>One swing per clip, or film a whole session (up to an hour): videos longer than 25 s are split into separate swings automatically. Chips and putts are skipped.</li>
      <li>Keep the phone on the screen-on setting and the page open until the upload finishes.</li>
      <li>Slow-mo (120/240 fps) gives smoother tracking; normal video works too.</li>
    </ul></details>
  <div id="icloud"></div>
  <h2>Swings</h2><div id="list" class="muted">Loading…</div>`;
  api("/api/icloud").then(ic => {
    if (!ic.enabled) return;
    $("#icloud").innerHTML = ic.needs_signin
      ? `<div class="card chk warn"><b>iCloud sign-in needed</b><div class="muted">Apple wants your password and a 2FA code again before new videos from the "${esc(ic.album)}" album can come in.</div>
         ${ic.signin_url ? `<div style="margin-top:10px"><a class="btn" href="${esc(ic.signin_url)}" target="_blank">Open the sign-in page</a></div>` : ""}</div>`
      : `<div class="card muted">Videos you add to the <b>${esc(ic.album)}</b> album in Photos show up here automatically, about 5 minutes after iCloud has them.${ic.reachable ? "" : " (The iCloud downloader isn't running.)"}</div>`;
  }).catch(() => {});
  $("#view").value = store.get("view", "auto");
  $("#view").onchange = e => store.set("view", e.target.value);
  $("#f").onchange = e => { const fs = [...e.target.files], mb = fs.reduce((a, f) => a + f.size, 0) / 1e6;
    $("#fname").textContent = fs.length > 1 ? `${fs.length} videos · ${mb.toFixed(0)} MB` : fs.length ? `${fs[0].name} · ${mb.toFixed(0)} MB` : "";
    $("#go").disabled = !fs.length; };
  $("#go").onclick = upload;
  try {
    const items = await api("/api/swings");
    const card = s => `
      <a class="card hist" href="#/s/${s.id}">
        ${s.thumb ? `<img src="${s.thumb}" loading="lazy">` : `<div class="ph"></div>`}
        <div style="flex:1;min-width:0">
          <div class="t">${esc(s.label || new Date(s.created*1000).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}))}</div>
          <div class="muted">${s.kind === "session" ? '<span class="pill">Session</span>' : ""}${s.is_reference ? '<span class="pill ref">Reference</span>' : ""}${s.view ? `<span class="pill">${VIEW[s.view]}</span>` : ""}
          ${s.kind === "session" ? (s.status === "done" ? `${s.swings_done} swings` : s.status === "error" ? "error" : esc(s.stage || s.status) + (s.swings_found ? ` · ${s.swings_done}/${s.swings_found} done` : ""))
            : s.status === "done" ? (s.is_reference ? "" : dots(s.counts)) : esc(s.status)}</div>
        </div></a>`;
    const mine = items.filter(s => !s.is_reference), refs = items.filter(s => s.is_reference);
    $("#list").innerHTML = (mine.length ? mine.map(card).join("") : "No swings yet.")
      + (refs.length ? `<h2>Reference swings</h2>${refs.map(card).join("")}` : "");
  } catch (e) { $("#list").textContent = e.message; }
}

const CHUNK = 16 * 1024 * 1024;
const sleep = ms => new Promise(r => setTimeout(r, ms));

function putChunk(id, offset, blob, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.upload.onprogress = e => onProgress(e.loaded);
    xhr.onload = () => {
      let body = {}; try { body = JSON.parse(xhr.responseText || "{}"); } catch {}
      if (xhr.status === 200) return resolve(body.received);
      if (xhr.status === 409 && body.detail && typeof body.detail.received === "number") return resolve(body.detail.received);
      const err = new Error(body.detail || `error ${xhr.status}`); err.status = xhr.status; reject(err);
    };
    xhr.onerror = () => reject(new Error("connection lost"));
    xhr.ontimeout = () => reject(new Error("timed out"));
    xhr.timeout = 10 * 60 * 1000;
    xhr.open("PUT", `/api/uploads/${id}?offset=${offset}`);
    xhr.setRequestHeader("Content-Type", "application/octet-stream");
    xhr.send(blob);
  });
}

// Resumable: 16 MB pieces, each retried until it lands. Picking the same file again after the page
// was closed continues where it stopped.
async function sendOne(f, label, n, total) {
  const pre = total > 1 ? `Video ${n} of ${total}: ` : "";
  const key = `upload:${f.name}:${f.size}:${f.lastModified}`;
  const show = (done, note) => {
    $("#bar div").style.width = (100 * done / f.size) + "%";
    $("#msg").textContent = `${pre}${note || "uploading…"} ${(done/1e6).toFixed(0)} of ${(f.size/1e6).toFixed(0)} MB. Keep this page open.`;
  };
  let id = store.get(key, null), offset = 0;
  if (id) {
    try { offset = (await api(`/api/uploads/${id}`)).received; } catch { id = null; }
  }
  if (!id) {
    const r = await api("/api/uploads", { method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ filename: f.name, size: f.size, view: $("#view").value, label,
                             note: "", is_reference: $("#isref").checked }) });
    id = r.upload_id; offset = 0; store.set(key, id);
  }
  let wait = 2000;
  while (offset < f.size) {
    try {
      offset = await putChunk(id, offset, f.slice(offset, Math.min(f.size, offset + CHUNK)), l => show(offset + l));
      wait = 2000; show(offset);
    } catch (e) {
      if (e.status === 404 || e.status === 413 || e.status === 400) { store.set(key, ""); throw new Error(pre + e.message); }
      show(offset, `connection problem (${e.message}), retrying in ${Math.round(wait/1000)} s…`);
      await sleep(wait); wait = Math.min(wait * 2, 30000);
      try { offset = (await api(`/api/uploads/${id}`)).received; } catch {}
    }
  }
  $("#msg").textContent = `${pre}finishing…`;
  let res;
  for (let i = 0; ; i++) {
    try { res = await api(`/api/uploads/${id}/finish`, { method: "POST" }); break; }
    catch (e) { if (i > 20) throw new Error(pre + e.message); await sleep(3000); }
  }
  store.set(key, "");
  return res.ids;
}

async function upload() {
  const files = [...$("#f").files]; if (!files.length) return;
  const base = $("#label").value.trim();
  $("#go").disabled = true; $("#bar").hidden = false;
  let lock = null; try { lock = await navigator.wakeLock.request("screen"); } catch {}
  let last = null, count = 0, failed = [];
  for (let i = 0; i < files.length; i++) {
    const label = files.length > 1 && base ? `${base} · video ${i + 1}` : base;
    try { const ids = await sendOne(files[i], label, i + 1, files.length); count += ids.length; last = ids[0]; }
    catch (e) { failed.push(e.message); }
  }
  try { lock && lock.release(); } catch {}
  if (failed.length) { $("#msg").textContent = failed.join(" "); $("#go").disabled = false; return; }
  location.hash = count > 1 ? "#/" : `#/s/${last}`;
  if (count > 1) route();
}

async function showSwing(id, ref) {
  const app = $("#app");
  let s;
  try { s = await api(`/api/swings/${id}${ref ? `?ref=${ref}` : ""}`); }
  catch (e) { app.innerHTML = `<h1><a href="#/">← SwingCheck</a></h1><div class="card">${esc(e.message)}</div>`; return; }
  if (s.kind === "session") return showSession(s, id);
  const head = s.session_id
    ? `<h1><a href="#/s/${s.session_id}">← ${esc(s.session_label)}</a></h1>`
    : `<h1><a href="#/">← SwingCheck</a></h1>`;
  if (s.status === "queued" || s.status === "processing") {
    app.innerHTML = `${head}<div class="card"><b>${s.status === "queued" ? "Waiting in line…" : "Analyzing…"}</b>
      <div class="bar"><div style="width:${Math.round((s.progress||0)*100)}%"></div></div>
      <div class="muted" style="margin-top:8px">Usually 20–90 seconds depending on clip length and frame rate.</div></div>`;
    pollTimer = setTimeout(() => showSwing(id, ref), 2000); return;
  }
  if (s.status === "error") {
    app.innerHTML = `${head}<div class="card chk bad"><b>Couldn't analyze this video</b><p>${esc(s.error)}</p>
      <button class="ghost" id="del">Delete</button></div>`;
    $("#del").onclick = () => del(id); return;
  }
  const r = s.result, v = r.video;
  const pri = r.checks.find(c => c.id === r.top_priority);
  const cmp = s.comparison;
  app.innerHTML = `${head}
    <div class="muted" style="margin-bottom:8px">${s.practice ? '<span class="pill">Practice</span>' : ""}${s.is_reference ? '<span class="pill ref">Reference</span>' : ""}<span class="pill">${VIEW[r.view]}</span>
      ${new Date(s.created*1000).toLocaleString()} ${s.label ? "· " + esc(s.label) : ""}</div>
    ${r.tracking && r.tracking.grade === "poor" ? `<div class="card chk bad" style="margin-bottom:10px">Tracking was poor on this swing (${r.tracking.repaired_pct}% of frames needed repair), so treat these numbers with caution.</div>` : ""}
    <video src="/media/${id}/${v.video}" controls playsinline muted loop preload="metadata"></video>
    <div class="muted" style="margin:6px 0 0">${v.fps >= 90 ? `Shown at ${Math.round(r.fps_effective / v.playback_fps)}× slow motion. ` : ""}Cyan lines mark your address position; yellow is your hand path.</div>
    ${pri ? `<div class="card priority" style="margin-top:14px"><div class="muted">Work on this first</div>
      <div style="font-weight:700;font-size:17px">${esc(pri.title)}</div><div class="val">${esc(pri.value_text)}</div><div class="tip">${esc(pri.tip)}</div></div>`
      : `<div class="card" style="margin-top:14px"><b>No faults detected in what this camera angle can measure.</b></div>`}
    <h2>Form checks ${dots(r.counts)}</h2>
    ${r.checks.map(c => `<div class="card chk ${c.status}">
      <div class="head"><span class="title">${esc(c.title)}</span><span class="status ${c.status}">${c.status === "warn" ? "check" : c.status}</span></div>
      <div class="val">${esc(c.value_text)} <span class="muted">· target ${esc(c.target_text)}</span></div>
      <div class="muted">${esc(c.detail)}${c.confidence === "low" ? " <b>Low confidence: the body parts used were hard to see.</b>" : ""}</div>
      ${c.tip ? `<div class="tip">${esc(c.tip)}</div>` : ""}</div>`).join("")}
    <h2>Key positions${cmp ? ` vs ${esc(cmp.ref_label)}` : ""}</h2>
    ${s.available_refs.length > 1 ? `<select id="refsel" style="margin-bottom:10px">${s.available_refs.map(x => `<option value="${x.id}" ${cmp && cmp.ref_id === x.id ? "selected" : ""}>Compare to: ${esc(x.label)}</option>`).join("")}</select>` : ""}
    ${cmp ? `<div>${["address","top","impact","finish"].map(p => `<div style="margin-bottom:10px"><div class="muted" style="text-transform:capitalize">${p}</div>
        <div class="pair"><img style="width:100%;border-radius:8px" src="/media/${id}/${p}.jpg"><img style="width:100%;border-radius:8px" src="/media/${cmp.ref_id}/${p}.jpg"></div></div>`).join("")}
        <div class="muted" style="margin-bottom:10px">Left: you · Right: ${esc(cmp.ref_label)}</div></div>
      <h2>Numbers vs ${esc(cmp.ref_label)}</h2>
      <div class="card"><table><tr><th></th><th>You</th><th>${esc(cmp.ref_label)}</th></tr>
        ${cmp.rows.map(x => `<tr><td>${esc(x.title)}</td><td class="s-${x.mine_status}">${esc(x.mine)}</td><td class="s-${x.ref_status}">${esc(x.ref)}</td></tr>`).join("")}
      </table></div>`
    : `<div class="grid">${Object.keys(v.stills).map(p => `<figure><img src="/media/${id}/${p}.jpg"><figcaption>${p}</figcaption></figure>`).join("")}</div>
       ${s.is_reference ? "" : `<p class="muted">Upload a pro swing filmed ${r.view === "dtl" ? "down-the-line" : "face-on"} and tick "reference swing" to compare against it here.</p>`}`}
    <h2>Details</h2>
    <div class="card">
      <label>Label</label><input type="text" id="lab" value="${esc(s.label)}">
      <label>Notes</label><input type="text" id="note" value="${esc(s.note)}" placeholder="e.g. felt good, pulled it left">
      ${s.session_id ? `<label class="check"><input type="checkbox" id="prac" ${s.practice ? "checked" : ""}> Practice swing (left out of the session summary)</label>` : ""}
      <label class="check"><input type="checkbox" id="isref" ${s.is_reference ? "checked" : ""}> Use as a reference swing for comparisons</label>
      <div class="row" style="margin-top:12px"><button class="ghost" id="save">Save</button><button class="ghost" id="del" style="margin-left:auto">Delete swing</button></div>
      <div class="muted" style="margin-top:10px">Tempo ${r.metrics.tempo_ratio}:1 · analysed at ${r.fps_effective} fps · ${r.metrics.handedness_guess}-handed (detected)${r.tracking ? ` · arm tracking repaired in ${r.tracking.repaired_pct}% of frames (${r.tracking.grade})` : ""}</div>
    </div>`;
  if ($("#refsel")) $("#refsel").onchange = e => location.hash = `#/s/${id}?ref=${e.target.value}`;
  $("#save").onclick = async () => {
    await api(`/api/swings/${id}`, { method: "PATCH", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ label: $("#lab").value, note: $("#note").value, is_reference: $("#isref").checked,
                             ...($("#prac") ? { practice: $("#prac").checked } : {}) }) });
    $("#save").textContent = "Saved"; setTimeout(() => $("#save") && ($("#save").textContent = "Save"), 1500);
  };
  $("#del").onclick = () => del(id);
}

function showSession(s, id) {
  const app = $("#app");
  const busy = s.status === "queued" || s.status === "processing";
  const fmt = sec => `${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,"0")}`;
  const done = s.swings.filter(x => x.status === "done");
  const top = s.checks.filter(c => c.bad + c.warn > 0).slice(0, 3);
  app.innerHTML = `<h1><a href="#/">← SwingCheck</a></h1>
    <div class="muted" style="margin-bottom:8px"><span class="pill">Session</span>${s.is_reference ? '<span class="pill ref">Reference</span>' : ""}
      ${new Date(s.created*1000).toLocaleString()} ${s.label ? "· " + esc(s.label) : ""}${s.info ? ` · ${fmt(s.info.duration)} of video` : ""}</div>
    ${busy ? `<div class="card"><b>${s.status === "queued" ? "Waiting in line…" : esc(s.stage || "Working…")}</b>
      <div class="bar"><div style="width:${Math.round((s.progress||0)*100)}%"></div></div>
      <div class="muted" style="margin-top:8px">Finding swings takes about a minute per 5 minutes of video, then about 20–40 s per swing.
      Swings show up below as they finish. You can close this page and come back.</div></div>` : ""}
    ${s.status === "error" ? `<div class="card chk bad"><b>Couldn't analyze this video</b><p>${esc(s.error)}</p></div>` : ""}
    ${s.poor_tracking || s.practice ? `<div class="muted" style="margin:8px 0">Left out of the summary: ${[s.practice ? `${s.practice} practice swing${s.practice > 1 ? "s" : ""} (another swing followed within 10 s; change it on the swing's page)` : "", s.poor_tracking ? `${s.poor_tracking} with poor tracking` : ""].filter(Boolean).join(", ")}.</div>` : ""}
    ${done.length ? `<h2>What to work on (${done.length - (s.poor_tracking || 0) - (s.practice || 0)} swings)</h2>
      ${top.length ? top.map((c, i) => `<div class="card ${i === 0 ? "priority" : ""}"><div style="font-weight:700">${esc(c.title)}</div>
        <div class="val">Flagged in ${c.bad + c.warn} of ${c.n} swings${c.bad ? ` (${c.bad} bad)` : ""}</div>${c.tip ? `<div class="tip">${esc(c.tip)}</div>` : ""}</div>`).join("")
        : `<div class="card"><b>No faults detected in what this camera angle can measure.</b></div>`}
      <h2>Every check</h2>
      <div class="card"><table><tr><th></th><th class="s-good">Good</th><th class="s-warn">Check</th><th class="s-bad">Bad</th></tr>
        ${s.checks.map(c => `<tr><td>${esc(c.title)}</td><td>${c.good}</td><td>${c.warn}</td><td>${c.bad}</td></tr>`).join("")}</table></div>` : ""}
    <h2>Swings${s.swings.length ? ` (${s.swings.length})` : ""}</h2>
    ${s.swings.length ? s.swings.map(x => `
      <a class="card hist" href="#/s/${x.id}">
        ${x.thumb ? `<img src="${x.thumb}" loading="lazy">` : `<div class="ph"></div>`}
        <div style="flex:1;min-width:0"><div class="t">#${x.index} <span class="muted">at ${fmt(x.peak || 0)}</span></div>
        <div class="muted">${x.status === "done" ? (x.practice ? '<span class="pill">Practice</span>' : "") + trackPill(x.tracking) + dots(x.counts) : x.status === "error" ? "Skipped: " + esc(x.error || "") : esc(x.status)}</div></div></a>`).join("")
      : `<div class="muted">${busy ? "None yet." : "None."}</div>`}
    <div class="card" style="margin-top:16px">
      <label>Label</label><input type="text" id="lab" value="${esc(s.label)}">
      <div class="row" style="margin-top:12px"><button class="ghost" id="save">Save</button>
        ${s.can_reanalyze && !busy ? `<button class="ghost" id="rean">Re-analyze</button>` : ""}
        <button class="ghost" id="del" style="margin-left:auto">Delete session</button></div>
    </div>`;
  $("#save").onclick = async () => {
    await api(`/api/swings/${id}`, { method: "PATCH", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ label: $("#lab").value }) });
    $("#save").textContent = "Saved"; setTimeout(() => $("#save") && ($("#save").textContent = "Save"), 1500);
  };
  $("#del").onclick = () => del(id, "Delete this session and all its swings?");
  if ($("#rean")) $("#rean").onclick = async () => {
    if (!confirm("Run the analysis again on this video? The current results are replaced.")) return;
    await api(`/api/swings/${id}/reanalyze`, { method: "POST" }); showSwing(id);
  };
  if (busy) pollTimer = setTimeout(() => showSwing(id), 4000);
}

async function del(id, msg) {
  if (!confirm(msg || "Delete this swing?")) return;
  const s = await api(`/api/swings/${id}`).catch(() => ({}));
  await api(`/api/swings/${id}`, { method: "DELETE" });
  location.hash = s.session_id ? `#/s/${s.session_id}` : "#/";
}
route();
</script>
</body>
</html>
